<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rental Car</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page-background">

        <div class="rental-card">

            <h2>Search for a rental car</h2>


            <div class="mb-2">

                <label for="location" class="form-label">
                    Pick up location
                </label>

                <input type="text" id="location" class="form-control" placeholder="City, airport, region, district...">

            </div>



            <div class="form-check mb-3">

                <input class="form-check-input" type="checkbox" id="differentLocation">

                <label class="form-check-label" for="differentLocation">
                    Deliver the car somewhere else
                </label>

            </div>



            <div class="row">


                <div class="col-6">

                    <label for="pickupDate" class="form-label">
                        Date of pickup
                    </label>

                    <input type="date" id="pickupDate" class="form-control" value="2026-09-11">

                </div>



                <div class="col-6">

                    <label for="deliveryDate" class="form-label">
                        Date of delivery
                    </label>

                    <input type="date" id="deliveryDate" class="form-control" value="2026-09-12">

                </div>

            </div>



            <div class="row mt-2">


                <div class="col-6">

                    <div class="row">


                        <div class="col-6">

                            <select class="form-select">

                                <option selected>10</option>
                                <option>09</option>
                                <option>11</option>
                                <option>12</option>

                            </select>

                        </div>



                        <div class="col-6">

                            <select class="form-select">

                                <option selected>00</option>
                                <option>15</option>
                                <option>30</option>
                                <option>45</option>

                            </select>

                        </div>

                    </div>

                </div>



                <div class="col-6">

                    <div class="row">

                        <div class="col-6">

                            <select class="form-select">

                                <option selected>10</option>
                                <option>09</option>
                                <option>11</option>
                                <option>12</option>

                            </select>

                        </div>



                        <div class="col-6">

                            <select class="form-select">

                                <option selected>00</option>
                                <option>15</option>
                                <option>30</option>
                                <option>45</option>

                            </select>

                        </div>

                    </div>

                </div>

            </div>



            <div class="form-check mt-3">

                <input class="form-check-input" type="checkbox" id="driverAge" checked>

                <label class="form-check-label" for="driverAge">
                    The driver's age between 30 and 65?
                </label>

            </div>



            <div class="benefits">

                <p>
                    No credit card fees
                </p>

                <p>
                    No change fees
                </p>

                <p>
                    Price match guarantee
                </p>

            </div>



            <button type="button" class="btn search-btn">
                Search
            </button>


        </div>

    </div>

</body>

</html>
